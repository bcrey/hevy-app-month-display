<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;
background:linear-gradient(135deg,#F5F6F8 0%,#E6EEFF 100%);display:flex;align-items:center;padding:0 80px;gap:56px}
.l{flex:1}
.logo{width:88px;height:88px;margin-bottom:32px}
h1{font-size:80px;font-weight:800;letter-spacing:-2.5px;color:#1a1a1a;line-height:1}
p{font-size:32px;color:#555;margin-top:22px;line-height:1.3;max-width:470px}
.chip{display:inline-block;margin-top:34px;background:#2979FF;color:#fff;font-size:22px;font-weight:600;padding:10px 20px;border-radius:999px}
.dom{position:absolute;right:80px;bottom:40px;font-size:22px;color:#888;font-weight:600}
.cal{width:520px;background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 40px rgba(21,101,192,.15)}
.cal h2{font-size:26px;font-weight:700;color:#1a1a1a;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.c{height:62px;border-radius:10px;background:#F2F4F7;position:relative;padding:5px 6px}
.c.empty{background:transparent}
.c.on{background:#EAF1FF}
.c b{font-size:13px;color:#999;font-weight:600}
.c i{position:absolute;top:4px;right:4px;background:#FF7A00;color:#fff;font-style:normal;font-size:11px;font-weight:700;width:17px;height:17px;border-radius:50%;text-align:center;line-height:17px}
.e{font-size:17px;line-height:1;margin-top:3px;letter-spacing:-2px}
</style></head><body>
<div class="l">
<img class="logo" src="icon.svg">
<h1>Workout<br>Calendar</h1>
<p>Every Hevy workout on every day, at a glance.</p>
<span class="chip">Synced live from Hevy</span>
</div>
